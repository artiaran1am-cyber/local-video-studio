name: Android editor evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: android-editor-evaluation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Acquire pinned public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SysAdminDoc/ClearCut
          ref: fbac89e268f1238f8f71189e2ba55dd2ed6abcd9
          path: candidate
          persist-credentials: false
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify source and native package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          git -C candidate rev-parse HEAD | tee evaluation/source-commit.txt
          test "$(cat evaluation/source-commit.txt)" = fbac89e268f1238f8f71189e2ba55dd2ed6abcd9
          printf '%s  %s\n' \
            '7971240aff84ce59a4ab28400bb4af59d24c20ce68c25525d41d910246ccff62' \
            'candidate/third_party/ffmpeg-kit-next/ffmpeg-kit-next-8.1.0.aar' \
            | sha256sum --check | tee evaluation/native-hash-check.txt
          java -version 2> evaluation/java-version.txt
          uname -a > evaluation/runner.txt
          cp candidate/gradle/wrapper/gradle-wrapper.properties evaluation/
          cp candidate/gradle/libs.versions.toml evaluation/
          test "$(curl -fsSL --retry 2 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip.sha256 | tr -d '[:space:]')" = bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --list_installed > evaluation/sdk-before.txt
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 2>&1 | tee evaluation/sdk-install.txt
          "$SDK_MANAGER" --list_installed > evaluation/sdk-after.txt

      - name: Add individually verified missing dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as E
          p=Path("candidate/gradle/verification-metadata.xml")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "080d7ae27dde11c1334d2c24b73e5caab7bb8477a621620f2cab46f4c9781ffb", "Unexpected upstream verification file"
          rows=[{'group': 'com.google.guava', 'name': 'guava-parent', 'version': '33.4.0-jre', 'artifact': 'guava-parent-33.4.0-jre.pom', 'sha256': '3a499ed34a0d9ee0f1bcc39230021a1cd4e2f7dd0426ab6844f585465d41dcd7'}, {'group': 'org.junit', 'name': 'junit-bom', 'version': '5.10.2', 'artifact': 'junit-bom-5.10.2.module', 'sha256': 'de23b114b3e4119a8fe6eb17bed5a3852816698bace67071579d6d927ebb080a'}, {'group': 'org.junit', 'name': 'junit-bom', 'version': '5.11.0-M2', 'artifact': 'junit-bom-5.11.0-M2.module', 'sha256': '86477abcf490d6ca059aa9973cb108d22a506f49d1a5569bb32cc6cbf43c2cce'}, {'group': 'org.jetbrains.kotlin', 'name': 'kotlin-gradle-plugins-bom', 'version': '2.2.10', 'artifact': 'kotlin-gradle-plugins-bom-2.2.10.module', 'sha256': 'e4b7dd0b5570aa7ae6597d1f479bcea94e78e12735fa86f80afa95e7014efed6'}, {'group': 'org.jetbrains.kotlin', 'name': 'kotlin-gradle-plugins-bom', 'version': '2.2.10', 'artifact': 'kotlin-gradle-plugins-bom-2.2.10.pom', 'sha256': 'c0a5a21a4e6eec4d8bb6a2c491fac42f35ab9f08dd2af6bedb085715ac805296'}]
          rows.append({'group': 'org.jetbrains.kotlinx', 'name': 'kotlinx-coroutines-bom', 'version': '1.10.2', 'artifact': 'kotlinx-coroutines-bom-1.10.2.pom', 'sha256': 'faf0c6538e53ddc0499a63664d8e763c216580b2e18e722ccbdf1b431a6afe26'})
          rows.append({'group': 'org.jetbrains.kotlinx', 'name': 'kotlinx-coroutines-bom', 'version': '1.8.0', 'artifact': 'kotlinx-coroutines-bom-1.8.0.pom', 'sha256': '1239e9dbe1397cd5971342956b2511bc3ace7b641842e4372a088dcfa8b9ad55'})
          rows.append({'group': 'com.android.tools.build', 'name': 'aapt2', 'version': '9.4.1-15978811', 'artifact': 'aapt2-9.4.1-15978811-linux.jar', 'sha256': 'f5bebd466ecf14d341fd465f2756a16d86052f29eb4532003d5ff7bcffd08de5'})
          ns="https://schema.gradle.org/dependency-verification"
          E.register_namespace("",ns)
          tree=E.parse(p); root=tree.getroot(); components=root.find("{"+ns+"}components")
          assert components is not None
          for row in rows:
              attrs={k:row[k] for k in ("group","name","version")}
              comp=next((c for c in components if all(c.get(k)==v for k,v in attrs.items())),None)
              if comp is None: comp=E.SubElement(components,"{"+ns+"}component",attrs)
              assert not any(a.get("name")==row["artifact"] for a in comp), "Refusing to replace existing artifact verification"
              artifact=E.SubElement(comp,"{"+ns+"}artifact",{"name":row["artifact"]})
              E.SubElement(artifact,"{"+ns+"}sha256",{"value":row["sha256"],"origin":"Explicit addition checked against its publisher bytes and checksum; see docs/verification-additions.json, 2026-10-16"})
          tree.write(p,encoding="UTF-8",xml_declaration=True)
          Path("evaluation/verification-additions.json").write_text(json.dumps(rows,indent=2))
          print("Added exactly eight missing dependency hashes; existing verification retained.")
          PY

      - name: Build evaluation APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          mkdir -p "$RUNNER_TEMP/editor-build-home" "$RUNNER_TEMP/editor-gradle"
          cd candidate
          # Restricted environment; no account secrets supplied to project scripts.
          # Heap/workers are evaluation-runner settings, not phone settings.
          env -i \
            PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT" \
            HOME="$RUNNER_TEMP/editor-build-home" \
            GRADLE_USER_HOME="$RUNNER_TEMP/editor-gradle" \
            TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            bash ./gradlew --dependency-verification strict --no-daemon --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' \
            -Dorg.gradle.workers.max=2 \
            :app:compileDebugNavigationResources :app:assembleDebug 2>&1 | tee ../evaluation/build.log

      - name: Inventory APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          files=sorted(Path('candidate/app/build/outputs/apk').rglob('*.apk'))
          if not files:
              raise SystemExit('No APK produced; evaluation fails.')
          records=[{'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          Path('evaluation/apk-inventory.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY

      - name: Inspect phone APK and verify its signing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APK="$(find candidate/app/build/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > evaluation/phone-apk-manifest.xml
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > evaluation/phone-apk-signature.txt
          "$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk "$APK" | tee evaluation/phone-apk-min-sdk.txt
          test "$(cat evaluation/phone-apk-min-sdk.txt | tr -d '[:space:]')" -le 33

      - name: Preserve build evidence and APK if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-editor-evaluation
          path: |
            evaluation/
            candidate/build/reports/dependency-verification/
            candidate/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 3
